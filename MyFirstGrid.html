<!DOCTYPE html>
<html>

    <head>

        <title>My Hobby Cards</title>

        <meta charset="utf-8">
        
        <meta name="viewport" content="width=device-width, initial-scale=1">
        
        <!-- STEP 1 - Bootstrap CSS link -->
        
        <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

        <style>
           body{

            background-color: #f9f9f9;
            font-family: arial, sans-serif;
            padding: 30px 15px;

           }

           h1{

            text-align: center;
            color:#ff5a43 ;
           

           }

           .hobby-card{

            text-align: center;
            border: 2px solid #ff5a43;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            background-color: #fff9e1;
            
           }

           .hobby-card h3{

            color: #ff5a43;
            
           }

        </style>

    </head>

    ,<body>
        
        <h1> My Hobby Cards</h1>

        <div class="container">

        <div class="row">

         <div class="col-12 col-md-6 col-lg-4">

        <div class="hobby-card">

            <h3>Drawing</h3>

           <p> I love sketching comic character and animals </p>

         </div>

        </div>

        <div class="col-12 col-md-6 col-lg-4">
        
            <div class="hobby-card">
        
                <h3>Football</h3>
        
                <p> I play football every evening with my friends </p>
        
            </div>
        </div>

            <div class="col-12 col-md-6 col-lg-4">
            
                <div class="hobby-card">
            
                    <h3>Reading</h3>
            
                    <p> I like to read adventure stories. </p>
            
                </div>
        
            </div>

          </div>

        </div>

        <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>

    </body>

</html>
