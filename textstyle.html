<!DOCTYPE html>

<html>

<head>

    <title>My Superhero Card</title>

    <style>
        body{
            background-color: skyblue;
            color:white;
            font-family: Arial,sans-serif;
            text-align: center;
        }

        .hero-name{
          font-size: 60px;
          font-weight: bold;
          color:yellow;
          text-shadow: 3px 3px orange;
        }

        .tagline{
            font-style: italic;
            color: rgb(230, 215, 173);
            text-transform: capitalize;
        }

        .label{
            text-transform: uppercase;
            text-decoration: underline;
            color: white;
        }

        .power{
            font-weight: bold;
            color: lightgreen;
        }

        .weakness{
            text-decoration: line-through;
            color:gray
        }

        .badge{
            font-size: 28px;
            font-weight: bold;
            color:gold;
            transform: rotate(15deg);

        }

        .madeby{
            color: coral;
            font-style: italic;
        }
        </style>
</head>

<body>
    <h1 class="hero-name">Thunder kid</h1>
    <p class="tagline">The most powerful hero in the school</p>
    <h2 class="label">Superpowers</h2>
    <p class="power">Can run faster than a cheetah</p>
    <h2 class="label">Weaknesses</h2>
    <h2 class="weakness">Maths homework</h2>
    <h2 class="weakness">Broccoli</h2>
    <p class="badge">Black panther</p>
    <p class="madeby">Created by Hrishik.</p>
</body>
</html>
